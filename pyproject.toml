[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simulacion-bioprocesos"
version = "0.2.0"
description = "Simulación de bioprocesos, cinética de Monod/Luedeking-Piret y escalado geométrico de biorreactores (20 L a 200 L)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Juan José Álvarez Morales", email = "jjalvarezm77@gmail.com" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
